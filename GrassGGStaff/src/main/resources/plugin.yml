name: GrassGGStaff
version: 1.1.0
main: me.sbpro.grassggstaff.GrassGGStaff
api-version: '1.21'
description: GrassGG network-wide custom staff punishment system.
author: GrassGG

commands:

  offend:
    description: Issue a punishment.
    usage: /offend <player> <reason>
    permission: grassgg.staff

  offence:
    description: Manage offences and SUS notes.
    usage: /offence <new|check|list|change|remove|reset|sus>

  sus:
    description: View and manage SUS notes.
    usage: /sus [add|remove]

  grassggstaff:
    description: GrassGGStaff administration command.
    usage: /grassggstaff <reload>
    permission: grassgg.staff

  ban:
    description: Redirects to the offence system.
    usage: /ban

  mute:
    description: Staff mute command.
    usage: /mute

  warn:
    description: Staff warning command.
    usage: /warn

  punish:
    description: Staff punishment command.
    usage: /punish

  chatlock:
    description: Lock or unlock chat.
    usage: /chatlock

  staffchat:
    description: Toggle staff chat.
    usage: /staffchat
    permission: grassgg.staff.chat

  clearchat:
    description: Clears the public chat.
    usage: /clearchat
    permission: grassgg.staff.clearchat

permissions:

  grassgg.staff:
    default: op

  grassgg.staff.check:
    default: op

  grassgg.staff.change:
    default: op

  grassgg.staff.remove:
    default: op

  grassgg.staff.reset:
    default: op

  grassgg.staff.exempt:
    default: false

  grassgg.staff.sus:
    default: op
    children:
      grassgg.staff.sus.add: true
      grassgg.staff.sus.remove: true

  grassgg.staff.sus.add:
    default: op

  grassgg.staff.sus.remove:
    default: op

  grassgg.staff.chat:
    default: op

  grassgg.staff.clearchat:
    default: op