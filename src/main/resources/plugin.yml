name: GrassGGCoins
version: 1.0.0-ALPHA
main: me.sbpro.grassggcoins.GrassGGCoins
description: GrassGG second currency plugin.
author: GrassGG
api-version: '26.2'
softdepend:
  - PlaceholderAPI

commands:
  coins:
    description: View your GrassGGCoins balance and information.
    usage: /coins [shop|give|take|set|balance]
    aliases: [coin]
  coinshop:
    description: Open the GrassGG coin shop.
    usage: /coinshop

permissions:
  grassgg.coins.use:
    description: Allows use of the /coins command.
    default: true
  grassgg.coins.shop:
    description: Allows use of the coin shop.
    default: true
  grassgg.coins.give:
    description: Allows giving coins to players.
    default: op
  grassgg.coins.take:
    description: Allows taking coins from players.
    default: op
  grassgg.coins.set:
    description: Allows setting player coin balances.
    default: op
  grassgg.coins.balance.others:
    description: Allows checking another player's coin balance.
    default: op
  grassgg.coins.shop.setdisplayitem:
    description: Allows setting a shop item's display item.
    default: op
