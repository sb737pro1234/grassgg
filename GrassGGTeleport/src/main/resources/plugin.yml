name: GrassGGTeleport
version: 1.0.0
main: me.sbpro.grassggteleport.GrassGGTeleport
api-version: '26.2'

author: GrassGG
description: A complete teleportation system for GrassGG.

commands:
  tp:
    description: Teleport players.
    usage: /tp <player|x> [player|y] [z]
    permission: grassgg.teleport.tp

  tpall:
    description: Teleport all players to you.
    usage: /tpall
    permission: grassgg.teleport.tpall

  tp2p:
    description: Teleport yourself to another player.
    usage: /tp2p <player>
    permission: grassgg.teleport.tp

  tphere:
    description: Teleport another player to you.
    usage: /tphere <player>
    permission: grassgg.teleport.tphere

  tpa:
    description: Request to teleport to another player.
    usage: /tpa <player>
    permission: grassgg.teleport.tpa

  tpahere:
    description: Request another player to teleport to you.
    usage: /tpahere <player>
    permission: grassgg.teleport.tpahere

  tpaccept:
    description: Accept a teleport request.
    usage: /tpaccept [player]
    permission: grassgg.teleport.tpaccept

  tpdeny:
    description: Deny the most recent teleport request.
    usage: /tpdeny
    permission: grassgg.teleport.tpdeny

  tpacancel:
    description: Cancel your outgoing teleport requests.
    usage: /tpacancel
    permission: grassgg.teleport.tpacancel

  tptoggle:
    description: Toggle incoming teleport requests.
    usage: /tptoggle
    permission: grassgg.teleport.tptoggle

  tpauto:
    description: Automatically accept incoming TPA requests.
    usage: /tpauto
    permission: grassgg.teleport.tpauto

  spectate:
    description: Spectate a player.
    usage: /spectate [player]
    permission: grassgg.teleport.spectate

permissions:
  grassgg.teleport:
    description: Base permission for GrassGGTeleport.
    default: op
    children:
      grassgg.teleport.tp: true
      grassgg.teleport.tp.coordinates: true
      grassgg.teleport.tp.others: true
      grassgg.teleport.tpall: true
      grassgg.teleport.tphere: true
      grassgg.teleport.spectate: true
      grassgg.teleport.tpa: true
      grassgg.teleport.tpahere: true
      grassgg.teleport.tpaccept: true
      grassgg.teleport.tpdeny: true
      grassgg.teleport.tpacancel: true
      grassgg.teleport.tptoggle: true
      grassgg.teleport.tpauto: true

  grassgg.teleport.tp:
    description: Use /tp.
    default: op

  grassgg.teleport.tp.coordinates:
    description: Use coordinate teleportation.
    default: op

  grassgg.teleport.tp.others:
    description: Teleport another player.
    default: op

  grassgg.teleport.tpall:
    description: Use /tpall.
    default: op

  grassgg.teleport.tpall.bypass:
    description: Bypass /tpall.
    default: false

  grassgg.teleport.tphere:
    description: Use /tphere.
    default: op

  grassgg.teleport.spectate:
    description: Use /spectate.
    default: op

  grassgg.teleport.tpa:
    description: Use /tpa.
    default: true

  grassgg.teleport.tpahere:
    description: Use /tpahere.
    default: true

  grassgg.teleport.tpaccept:
    description: Use /tpaccept.
    default: true

  grassgg.teleport.tpdeny:
    description: Use /tpdeny.
    default: true

  grassgg.teleport.tpacancel:
    description: Use /tpacancel.
    default: true

  grassgg.teleport.tptoggle:
    description: Use /tptoggle.
    default: true

  grassgg.teleport.tpauto:
    description: Use /tpauto.
    default: true