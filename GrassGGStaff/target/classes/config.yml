# ============================================================
# GrassGGStaff — network punishment system
# ============================================================
# Use ONE database for every GrassGG backend server.
# Do not create plugin tables manually; GrassGGStaff creates
# them automatically on startup.
#
# PebbleHost: Game Panel -> MySQL Databases
# Copy the Host, Port, Database Name, Username and password
# shown by PebbleHost below.
#
# IMPORTANT: never share or commit your database password.
# ============================================================
# ============================================================
# GrassGGStaff Database
# ============================================================
# Use the SAME MySQL/MariaDB database on every backend server.
# PebbleHost: Game Panel -> MySQL Databases.
# The database/schema must already exist; GrassGGStaff creates
# its own tables automatically.
#
# IMPORTANT: Replace the placeholder values below with the
# values shown by your database host.
# ============================================================
database:
  host: "YOUR-MYSQL-HOST"
  port: 3306
  database: "YOUR-DATABASE-NAME"
  username: "YOUR-MYSQL-USERNAME"
  password: "YOUR-MYSQL-PASSWORD"
  pool-size: 10
  use-ssl: false
  connection-timeout-ms: 10000
  idle-timeout-ms: 600000
  max-lifetime-ms: 1800000

offence-counting:
  mode: "PER_TIER"

synchronisation:
  enabled: true
  poll-seconds: 3

general:
  debug: false
  date-format: "dd/MM/yyyy HH:mm"
  unknown-player-message: true

screens:
  ban:
    - ""
    - "§8━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
    - "§2§lGRASS.GG"
    - "§8━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
    - ""
    - "§c§lYOU HAVE BEEN BANNED"
    - ""
    - "§cStaff Member §8» §f{staff}"
    - "§cReason §8» §f{reason}"
    - "§cDuration §8» §f{duration}"
    - "§cDate §8» §f{date}"
    - "§cExpiry §8» §f{expiry}"
    - ""
    - "§8━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
    - "§c§lAPPEAL"
    - "§7Join our Discord to appeal your punishment"
    - "§6discord.gg/A97Dkcb7TU"
    - "§8━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

  mute:
    - ""
    - "§8━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
    - "§2§lGRASS.GG"
    - "§8━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
    - ""
    - "§c§lYOU HAVE BEEN MUTED"
    - ""
    - "§cStaff Member §8» §f{staff}"
    - "§cReason §8» §f{reason}"
    - "§cDuration §8» §f{duration}"
    - "§cDate §8» §f{date}"
    - "§cExpiry §8» §f{expiry}"
    - ""
    - "§8━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
