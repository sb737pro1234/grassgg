regions:
  # You can have multiple regions.
  spawn:
    priority: 10
    # If you have multiple regions covering the same area, you can change the priority,
    # 1 being the lowest, 10 being the highest
    location:
      pos1: -50 60 -50
      pos2: 50 100 50
      world: world
      # Using * for both positions makes this region cover
      # the entire specified world, otherwise you can specify specific coordinates.


    flags:

      # Building
      block_break: deny
      block_place: deny

      # Interactions
      block_interact: deny
      doors_trapdoors: allow
      entity_interact: deny
      item_interact: deny
      windcharges: deny
      eat: allow

      # Combat
      pvp: deny
      projectile_damage: deny

      # Player damage
      fall_damage: deny
      fire_damage: deny
      lava_damage: deny
      drowning: deny
      suffocation: deny
      void_damage: deny

      # Player mechanics
      hunger: deny
      item_drop: deny
      item_pickup: deny

      # Mob spawning
      # mob_spawn_egg controls mobs spawned using spawn eggs.
      # mob_spawn_command controls command-spawned mobs such as /summon.
      # mob_spawn_natural controls every other creature spawn reason,
      # including normal natural spawning, spawners, raids, breeding, etc.
      mob_spawn_egg: deny
      mob_spawn_command: deny
      mob_spawn_natural: deny

      # World mechanics
      explosions: deny
      block_burn: deny
      weather: deny