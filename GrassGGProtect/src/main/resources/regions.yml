regions:

  # ==========================================================
  # SPECIFIC REGION
  # ==========================================================
  #
  # This region covers the area between the two positions.
  #

  spawn:
    priority: 10

    location:
      pos1: -50 60 -50
      pos2: 50 100 50
      world: world

    flags:

      # Building
      block_break: deny
      block_place: deny

      # Interactions
      block_interact: deny
      doors_trapdoors: allow
      entity_interact: deny
      item_interact: deny
      windcharges: deny
      eat: allow

      # Combat
      pvp: deny
      projectile_damage: deny

      # Player damage
      fall_damage: deny
      fire_damage: deny
      lava_damage: deny
      drowning: deny
      suffocation: deny
      void_damage: deny

      # Player mechanics
      hunger: deny
      item_drop: deny
      item_pickup: deny

      # Mob spawning
      # mob_spawn_egg controls mobs spawned using spawn eggs.
      # mob_spawn_command controls command-spawned mobs such as /summon.
      # mob_spawn_natural controls every other creature spawn reason,
      # including normal natural spawning, spawners, raids, breeding, etc.
      mob_spawn_egg: deny
      mob_spawn_command: deny
      mob_spawn_natural: deny

      # World mechanics
      explosions: deny
      block_burn: deny
      weather: deny


  # ==========================================================
  # ENTIRE WORLD
  # ==========================================================
  #
  # Using * for both positions makes this region cover
  # the entire specified world.
  #

  world_protection:
    priority: 1

    location:
      pos1: "*"
      pos2: "*"
      world: world

    flags:

      # Building
      block_break: allow
      block_place: allow

      # Interactions
      block_interact: allow
      doors_trapdoors: allow
      entity_interact: allow
      item_interact: allow
      windcharges: allow
      eat: allow

      # Combat
      pvp: allow
      projectile_damage: allow

      # Player damage
      fall_damage: allow
      fire_damage: allow
      lava_damage: allow
      drowning: allow
      suffocation: allow
      void_damage: allow

      # Player mechanics
      hunger: allow
      item_drop: allow
      item_pickup: allow

      # Mob spawning
      mob_spawn_egg: allow
      mob_spawn_command: allow
      mob_spawn_natural: allow

      # World mechanics
      explosions: allow
      block_burn: allow
      weather: allow
