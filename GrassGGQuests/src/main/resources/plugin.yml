name: GrassGGQuests
version: '1.0'
main: me.sbpro.grassggquests.GrassGGQuests
api-version: '26.2'
author: GrassGG
description: GrassGG quest system with Medium and Easy quests.
depend:
  - GrassGGCoins
commands:
  quests:
    description: Opens and manages the GrassGG quest system.
    usage: /quests [reload|reset|give]
    aliases:
      - quest
      - q
permissions:
  grassggquests.admin:
    description: Allows access to GrassGGQuests administration commands.
    default: op
